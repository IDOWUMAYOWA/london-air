name: ingest-live

on:
  schedule:
    - cron: "17 * * * *"     # every hour at minute 17 (UTC), off the busy top-of-hour
  workflow_dispatch:          # lets you run it manually from the Actions tab

# The live and full jobs share one API key and rate limit, so never overlap
concurrency:
  group: openaq-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Poll live sensors
        run: python ingest.py
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # always() so health checks still run when ingestion fails: that is
      # exactly when you most want to know the state of the data
      - name: Sensor health checks
        if: always()
        run: python health_checks.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}